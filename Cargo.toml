[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["André Cusimano"]

[workspace.dependencies]
rtk-document = { path = "crates/rtk-document" }
rtk-preview = { path = "crates/rtk-preview" }

# The toolkit's major version follows the rustroke version it targets
# (keep `codegen::RUSTROKE_VERSION` in sync).
rustroke = { version = "0.21.0", features = ["persistence"] }
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
ron = "0.11"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
